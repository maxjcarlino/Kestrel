<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kestrel Cytometry</title>
<meta name="description" content="Free, open-source flow cytometry analysis that runs in the browser: FCS files, compensation, Logicle scaling, hierarchical gating, statistics and reusable workflow templates.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@1&display=swap">
<style>
/* Kestrel — instrument-console layout: a quiet panel system around the plots,
   one accent drawn from the 488 nm laser line, spectral laser marks as brand. */
:root {
  --bg: #edf0f4;
  --panel: #ffffff;
  --panel-2: #f6f8fa;
  --sunken: #e6eaf0;
  --line: #d9dfe7;
  --line-2: #c3cbd7;
  --fg: #121821;
  --fg-2: #46526a;
  --fg-3: #75829a;
  --accent: #0a6ea2;
  --accent-2: #0b86c4;
  --accent-soft: #e1eff7;
  --accent-fg: #ffffff;
  --ok: #1c8754;
  --warn: #a66300;
  --bad: #c03a3a;
  --l405: #6d4cf2;
  --l488: #13a3dd;
  --l561: #8bbd1f;
  --l640: #e2433d;
  --plot-bg: #ffffff;
  --plot-axis: #6b7588;
  --plot-tick: #384152;
  --plot-dot: #273040;
  --plot-muted: #c6ccd6;
  --plot-gate: #283041;
  --plot-label-bg: rgba(255, 255, 255, 0.92);
  --plot-label-fg: #121821;
  --plot-hist: #5b6a81;
  --is-dark: 0;
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
  --shadow-pop: 0 14px 36px rgba(16, 24, 40, 0.18), 0 2px 6px rgba(16, 24, 40, 0.08);
  --radius: 8px;
  --radius-sm: 6px;
  --font-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-display: "Instrument Serif", Georgia, "Times New Roman", serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f14;
    --panel: #121921;
    --panel-2: #171f29;
    --sunken: #0e131a;
    --line: #242e3b;
    --line-2: #334050;
    --fg: #e3e8ef;
    --fg-2: #a2adbc;
    --fg-3: #6f7b8d;
    --accent: #45b6ea;
    --accent-2: #6dc7f1;
    --accent-soft: #0f2f45;
    --accent-fg: #04121c;
    --ok: #3cc187;
    --warn: #e2a23a;
    --bad: #ef6a62;
    --plot-bg: #0e141b;
    --plot-axis: #5b687a;
    --plot-tick: #b4bfcc;
    --plot-dot: #d3dbe5;
    --plot-muted: #3a4554;
    --plot-gate: #d7dfe9;
    --plot-label-bg: rgba(14, 20, 27, 0.9);
    --plot-label-fg: #e8edf4;
    --plot-hist: #8c9ab0;
    --is-dark: 1;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-pop: 0 16px 40px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0f14;
  --panel: #121921;
  --panel-2: #171f29;
  --sunken: #0e131a;
  --line: #242e3b;
  --line-2: #334050;
  --fg: #e3e8ef;
  --fg-2: #a2adbc;
  --fg-3: #6f7b8d;
  --accent: #45b6ea;
  --accent-2: #6dc7f1;
  --accent-soft: #0f2f45;
  --accent-fg: #04121c;
  --ok: #3cc187;
  --warn: #e2a23a;
  --bad: #ef6a62;
  --plot-bg: #0e141b;
  --plot-axis: #5b687a;
  --plot-tick: #b4bfcc;
  --plot-dot: #d3dbe5;
  --plot-muted: #3a4554;
  --plot-gate: #d7dfe9;
  --plot-label-bg: rgba(14, 20, 27, 0.9);
  --plot-label-fg: #e8edf4;
  --plot-hist: #8c9ab0;
  --is-dark: 1;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-pop: 0 16px 40px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}

/* ------------------------------------------------------------------ base */
html {
  height: 100%;
  box-sizing: border-box;
}
*, *::before, *::after {
  box-sizing: border-box;
}
body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 13px/1.45 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
#app {
  height: 100%;
}
button, input, select, textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
.num, .mono {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 12px;
}
.muted {
  color: var(--fg-3);
}
.small {
  font-size: 12px;
}
.eyebrow {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--fg-3);
}
.icon {
  flex: none;
  display: block;
}
h1, h2, h3 {
  text-wrap: balance;
  margin: 0;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* ------------------------------------------------------------------ shell */
.app {
  height: 100%;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.topbar {
  flex: none;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  position: relative;
  z-index: 5;
}
.topbar-inner {
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 52px;
  padding-left: var(--gutter-l);
  padding-right: var(--gutter-r);
  padding-block: 6px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  flex: none;
}
.brand-mark {
  display: block;
  width: 46px;
  margin-block: -4px;
  flex: none;
  --k1: #1b1e22;
  --k2: #454a52;
  --k3: #737981;
  --k4: #a7acb2;
  --k5: #e4e6e9;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .brand-mark { --k1: #f6f7f8; --k2: #d4d7db; --k3: #a6abb2; --k4: #767b83; --k5: #474c54; }
}
:root[data-theme="dark"] .brand-mark { --k1: #f6f7f8; --k2: #d4d7db; --k3: #a6abb2; --k4: #767b83; --k5: #474c54; }

.kestrel-mark { display: block; width: 100%; height: auto; overflow: visible; }
.k-fth { fill: var(--k4); stroke: var(--k2); stroke-width: 0.5; stroke-linejoin: round; }
.k-sec { fill: var(--k4); }
.k-far .k-fth { fill: var(--k3); stroke: var(--k1); }
.k-tf { fill: var(--k4); }
.k-shaft { fill: none; stroke: var(--k2); stroke-width: 0.4; opacity: 0.8; }
.k-fbar { fill: none; stroke: var(--k1); stroke-width: 1; stroke-linecap: round; opacity: 0.5; }
.k-ftip { fill: var(--k1); opacity: 0.88; }
.k-cov { fill: var(--k4); stroke: var(--k2); stroke-width: 0.5; }
.k-cov2 { fill: var(--k5); opacity: 0.45; }
.k-far .k-cov { fill: var(--k3); }
.k-hatch { fill: url(#k-hatch); opacity: 0.55; }
.k-hatch2 { fill: url(#k-hatch2); opacity: 0.4; }
.k-light { opacity: 0.25; }
.k-spot { fill: var(--k1); opacity: 0.75; }
.k-edge { fill: none; stroke: var(--k1); stroke-width: 0.9; stroke-linecap: round; }
.k-body { fill: var(--k5); stroke: var(--k3); stroke-width: 0.5; }
.k-back { fill: var(--k3); }
.k-streak { fill: none; stroke: var(--k2); stroke-width: 1.3; stroke-linecap: round; }
.k-leg { fill: var(--k4); stroke: var(--k2); stroke-width: 0.4; }
.k-toe { fill: none; stroke: var(--k2); stroke-width: 1; stroke-linecap: round; }
.k-head { fill: var(--k4); stroke: var(--k2); stroke-width: 0.5; }
.k-cap { fill: var(--k2); }
.k-brow { fill: none; stroke: var(--k5); stroke-width: 0.9; stroke-linecap: round; opacity: 0.8; }
.k-malar { fill: var(--k1); }
.k-ring { fill: var(--k5); }
.k-eye { fill: var(--k1); }
.k-glint { fill: var(--k5); }
.k-beak { fill: var(--k2); stroke: var(--k1); stroke-width: 0.4; }
.k-cere { fill: var(--k3); }

.brand-word {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 23px;
  line-height: 1;
  letter-spacing: 0.005em;
  color: var(--fg);
  padding-right: 2px;
}
.ws {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  padding-left: 14px;
  border-left: 1px solid var(--line);
}
.ws-label {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--fg-3);
}
.ws-name, .ws-name-input {
  font-size: 14.5px;
  font-weight: 600;
  min-width: 0;
}
.ws-name {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid transparent;
  background: transparent;
  border-radius: var(--radius-sm);
  padding: 4px 7px;
  max-width: 340px;
}
.ws-name:hover {
  border-color: var(--line);
  background: var(--panel-2);
}
.ws-name-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ws-name-pencil {
  color: var(--fg-3);
  opacity: 0;
  transition: opacity 0.12s;
}
.ws-name:hover .ws-name-pencil, .ws-name:focus-visible .ws-name-pencil {
  opacity: 1;
}
.ws-name-input {
  border: 1px solid var(--accent);
  border-radius: var(--radius-sm);
  padding: 3px 7px;
  background: var(--panel);
  outline: none;
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.save-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  border-radius: 999px;
  padding: 2px 9px 2px 8px;
  font-size: 11.5px;
  color: var(--fg-2);
  white-space: nowrap;
}
.save-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--fg-3);
}
.save-chip.is-saved .save-dot { background: var(--ok); }
.save-chip.is-pending .save-dot { background: var(--warn); }
.save-chip.is-saving .save-dot { background: var(--accent); animation: pulse 0.9s ease-in-out infinite; }
.save-chip.is-error { color: var(--bad); border-color: color-mix(in oklab, var(--bad) 40%, var(--line)); }
.save-chip.is-error .save-dot { background: var(--bad); }
.save-chip.is-off .save-dot { background: var(--line-2); }
@keyframes pulse {
  50% { opacity: 0.35; }
}
.views {
  display: flex;
  gap: 2px;
  margin-left: auto;
  background: var(--sunken);
  padding: 3px;
  border-radius: 9px;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.view-tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 0;
  background: transparent;
  color: var(--fg-2);
  padding: 5px 11px;
  border-radius: 7px;
  font-weight: 500;
  white-space: nowrap;
}
.view-tab:hover {
  color: var(--fg);
}
.view-tab.is-on {
  background: var(--panel);
  color: var(--fg);
  box-shadow: var(--shadow), 0 0 0 1px var(--line);
}
.view-tab.is-on .icon {
  color: var(--accent);
}
.topbar-tools {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: none;
}
.engine-chip {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--fg-3);
  padding: 3px 6px;
  border-radius: 6px;
}
.engine-chip.is-busy {
  color: var(--accent);
}
.engine-chip.is-busy .icon {
  animation: pulse 0.8s ease-in-out infinite;
}
.app-body {
  flex: 1;
  min-height: 0;
  display: flex;
  gap: 12px;
  padding-block: 12px;
  padding-left: var(--gutter-l);
  padding-right: var(--gutter-r);
}
.view {
  flex: 1;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

/* ------------------------------------------------------------------ controls */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid var(--line-2);
  background: var(--panel);
  color: var(--fg);
  border-radius: var(--radius-sm);
  padding: 6px 11px;
  font-weight: 500;
  line-height: 1.2;
  white-space: nowrap;
  transition: background 0.12s, border-color 0.12s;
}
.btn:hover:not(:disabled) {
  background: var(--panel-2);
  border-color: var(--fg-3);
}
.btn:disabled {
  opacity: 0.5;
  cursor: default;
}
.btn-sm {
  padding: 4px 9px;
  font-size: 12px;
}
.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-fg);
}
.btn-primary:hover:not(:disabled) {
  background: var(--accent-2);
  border-color: var(--accent-2);
}
.btn-danger {
  color: var(--bad);
}
.btn-danger:hover:not(:disabled) {
  border-color: var(--bad);
  background: color-mix(in oklab, var(--bad) 8%, var(--panel));
}
.ibtn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border: 1px solid transparent;
  background: transparent;
  border-radius: var(--radius-sm);
  color: var(--fg-2);
  flex: none;
}
.ibtn:hover:not(:disabled) {
  background: var(--panel-2);
  border-color: var(--line);
  color: var(--fg);
}
.ibtn:disabled {
  opacity: 0.4;
  cursor: default;
}
.ibtn.is-active {
  color: var(--accent);
  background: var(--accent-soft);
}
.link-btn {
  border: 0;
  background: none;
  padding: 0;
  color: var(--accent);
  font-weight: 500;
  text-align: left;
}
.link-btn:hover {
  text-decoration: underline;
}
.link-btn.danger {
  color: var(--bad);
}
.add-tree-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  margin: 4px 0 2px;
  font-size: 12.5px;
}
.tree-plot-card {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 2px 0 10px;
  padding: 8px 9px;
  border: 1px solid var(--line-2);
  border-radius: var(--radius-sm);
  background: var(--panel-2, var(--panel));
}
.tree-stat-cols {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  max-height: none;
  gap: 2px 12px;
  border: 0;
  padding: 2px 0;
}
.tree-stat-cols .check-row {
  width: auto;
}
.field {
  border: 1px solid var(--line-2);
  background: var(--panel);
  border-radius: var(--radius-sm);
  padding: 5px 8px;
  min-width: 0;
  width: 100%;
}
.field:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.field-sm {
  padding: 3px 6px;
  font-size: 12px;
}
.field.num {
  text-align: right;
}
select.field {
  padding-right: 22px;
}
.seg {
  display: inline-flex;
  background: var(--sunken);
  border-radius: 7px;
  padding: 2px;
  gap: 2px;
}
.seg button {
  border: 0;
  background: transparent;
  color: var(--fg-2);
  padding: 4px 9px;
  border-radius: 5px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
}
.seg button.is-on {
  background: var(--panel);
  color: var(--fg);
  box-shadow: var(--shadow), 0 0 0 1px var(--line);
}
.labelstat-seg .seg {
  flex-wrap: wrap;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 0 10px 8px;
}
.chip {
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--fg-2);
  border-radius: 999px;
  padding: 1px 9px;
  font-size: 11.5px;
}
.chip.is-on {
  background: var(--accent-soft);
  border-color: color-mix(in oklab, var(--accent) 45%, var(--line));
  color: var(--accent);
  font-weight: 600;
}
.pill {
  font-size: 11px;
  border-radius: 999px;
  padding: 1px 8px;
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 600;
}
.swatch {
  width: 18px;
  height: 18px;
  border-radius: 5px;
  border: 1px solid rgba(0, 0, 0, 0.15);
  padding: 0;
}
.swatch.big {
  width: 26px;
  height: 26px;
  border-radius: 7px;
  flex: none;
}
.swatch.is-on {
  box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--fg);
}
.swatch-dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 3px;
  flex: none;
}
.inline-edit {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid transparent;
  background: transparent;
  padding: 1px 5px;
  margin-left: -6px;
  border-radius: 5px;
  max-width: 100%;
  text-align: left;
}
.inline-edit:hover {
  border-color: var(--line);
}
.inline-edit-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.inline-edit-icon {
  color: var(--fg-3);
  opacity: 0;
}
.inline-edit:hover .inline-edit-icon {
  opacity: 1;
}

/* ------------------------------------------------------------------ panels */
.sidebar {
  width: var(--sidebar-w, 304px);
  flex: none;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 0;
}
.sidebar-resizer {
  flex: none;
  width: 10px;
  margin: 0 -5px;
  cursor: col-resize;
  position: relative;
  border-radius: 4px;
  z-index: 1;
}
.sidebar-resizer::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 6%;
  bottom: 6%;
  width: 3px;
  transform: translateX(-50%);
  border-radius: 3px;
  background: transparent;
  transition: background 0.1s;
}
.sidebar-resizer:hover::after, .sidebar-resizer:focus-visible::after {
  background: var(--accent);
}
.sidebar-resizer:focus-visible {
  outline: none;
}
.panel, .card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.panel {
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.panel.samples {
  flex: 0 1 auto;
  max-height: 44%;
}
.panel.samples.is-collapsed {
  flex: none;
}
.panel.tree {
  flex: 1 1 0;
}
.panel-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 8px 8px 10px;
  min-height: 42px;
}
.panel-title {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 0;
  background: none;
  padding: 0;
  font-weight: 600;
  font-size: 13px;
}
.panel-title .count {
  color: var(--fg-3);
  font-weight: 500;
  font-size: 11px;
  background: var(--sunken);
  border-radius: 999px;
  padding: 0 6px;
}
.panel-sub {
  margin-left: auto;
  color: var(--fg-3);
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 55%;
}
.panel-tools {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 4px;
}
.sample-list, .tree-list {
  list-style: none;
  margin: 0;
  padding: 0 6px 8px;
  overflow: auto;
  min-height: 0;
}
.sample-row {
  display: grid;
  grid-template-columns: 10px minmax(0, 1fr) auto auto 22px;
  align-items: center;
  gap: 7px;
  padding: 5px 4px 5px 8px;
  border-radius: 6px;
  cursor: pointer;
}
.sample-row:hover {
  background: var(--panel-2);
}
.sample-row.is-on {
  background: var(--accent-soft);
}
.sample-row.is-on .sample-name {
  color: var(--accent);
  font-weight: 600;
}
.sample-name {
  min-width: 0;
}
.fit-text {
  display: block;
  width: 100%;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sample-n {
  color: var(--fg-3);
  font-size: 11.5px;
}
.sample-groups {
  display: flex;
  gap: 3px;
  min-width: 0;
}
.mini-chip {
  font-style: normal;
  font-size: 10px;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0 4px;
  color: var(--fg-3);
  white-space: nowrap;
  max-width: 76px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.st-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--ok);
}
.st-dot.st-loading {
  background: var(--accent);
  animation: pulse 0.9s ease-in-out infinite;
}
.st-dot.st-missing {
  background: transparent;
  border: 1.5px solid var(--warn);
}
.st-dot.st-error {
  background: var(--bad);
}
.sample-row.st-missing .sample-name {
  color: var(--fg-3);
}
.row-more {
  border: 0;
  background: none;
  color: var(--fg-3);
  border-radius: 5px;
  width: 22px;
  height: 22px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
}
.sample-row:hover .row-more, .sample-row:focus-within .row-more, .mat-row:hover .row-more, .row-more:focus-visible {
  opacity: 1;
}
.row-more:hover {
  background: var(--sunken);
  color: var(--fg);
}
.row-input {
  padding: 1px 5px;
  font-size: 12.5px;
}
.notice {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin: 0 10px 8px;
  padding: 8px 10px;
  border-radius: 7px;
  background: color-mix(in oklab, var(--warn) 9%, var(--panel));
  border: 1px solid color-mix(in oklab, var(--warn) 30%, var(--line));
  font-size: 12px;
  color: var(--fg-2);
  flex-wrap: wrap;
}
.notice .icon {
  color: var(--warn);
  margin-top: 1px;
}
.notice span {
  flex: 1 1 160px;
}
.drop-hint {
  margin: 0 10px 10px;
  padding: 16px 12px;
  border: 1.5px dashed var(--line-2);
  border-radius: 8px;
  text-align: center;
  color: var(--fg-2);
}
.drop-hint .icon {
  margin: 0 auto 6px;
  color: var(--accent);
}
.drop-hint p {
  margin: 4px 0;
}
.tree-cols {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 58px 42px;
  gap: 6px;
  padding: 0 14px 4px 14px;
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--fg-3);
  font-weight: 600;
  border-bottom: 1px solid var(--line);
  margin-bottom: 4px;
}
.tree-cols .num {
  font-family: var(--font-ui);
  font-size: 10.5px;
  text-align: right;
}
.tree-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 58px 42px;
  gap: 6px;
  align-items: center;
  padding: 4px 8px 4px calc(6px + (var(--depth, 0) * 10px));
  border-radius: 6px;
  cursor: pointer;
  position: relative;
}
.tree-row:hover {
  background: var(--panel-2);
}
.tree-row.is-on {
  background: var(--accent-soft);
}
.tree-row.is-on .tree-label {
  font-weight: 600;
}
.tree-row .num {
  text-align: right;
  font-size: 11.5px;
}
.tree-name {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.tree-label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tree-row.depth-0 .icon {
  color: var(--fg-3);
}
.bool-tag {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--fg-3);
  border: 1px solid var(--line-2);
  border-radius: 3px;
  padding: 0 3px;
}
.adj-pill {
  font-style: normal;
  font-size: 9.5px;
  font-weight: 700;
  color: var(--warn);
  border: 1px solid color-mix(in oklab, var(--warn) 45%, var(--line));
  border-radius: 3px;
  padding: 0 3px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.tree-warn {
  color: var(--bad);
}
.tree-empty {
  color: var(--fg-3);
  font-size: 12px;
  padding: 4px 14px 12px;
  margin: 0;
}

/* ------------------------------------------------------------------ gating */
.gating {
  flex: 1;
  min-height: 0;
  display: flex;
  gap: 12px;
}
.gating-main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  min-height: 0;
  gap: 8px;
}
.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 14px;
  padding: 6px 8px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.sample-nav {
  display: flex;
  align-items: center;
  gap: 2px;
  min-width: 0;
}
.sample-pick {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  border-radius: var(--radius-sm);
  padding: 4px 9px;
  min-width: 0;
  max-width: 280px;
  font-weight: 600;
}
.sample-pick:hover:not(:disabled) {
  border-color: var(--line-2);
}
.sample-pick-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sample-pick-pos {
  color: var(--fg-3);
  font-weight: 400;
  font-size: 11px;
}
.tool-group {
  display: inline-flex;
  gap: 2px;
  background: var(--sunken);
  padding: 2px;
  border-radius: 8px;
}
.tool {
  width: 32px;
  height: 30px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--fg-2);
}
.tool:hover {
  color: var(--fg);
  background: color-mix(in oklab, var(--panel) 60%, transparent);
}
.tool.is-on {
  background: var(--panel);
  color: var(--accent);
  box-shadow: var(--shadow), 0 0 0 1px var(--line);
}
.scope {
  display: flex;
  align-items: center;
  gap: 8px;
}
.seg button.scope-one {
  color: var(--warn);
  box-shadow: var(--shadow), 0 0 0 1px color-mix(in oklab, var(--warn) 45%, var(--line));
}
.scope-label {
  font-size: 12px;
  color: var(--fg-3);
  white-space: nowrap;
}
.toolbar-end {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}
.size-ctl {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--fg-3);
}
.size-ctl input {
  width: 84px;
  accent-color: var(--accent);
}
.hint {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0;
  color: var(--fg-3);
  font-size: 12px;
  padding: 0 4px;
  min-height: 18px;
}
.plot-grid {
  flex: 1;
  min-height: 0;
  overflow: auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--plot-size)), 1fr));
  gap: 12px;
  align-content: start;
  padding: 1px 1px 24px;
}
.plot-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  min-width: 0;
  transition: box-shadow 0.25s, border-color 0.25s;
}
.plot-card.is-flash {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow);
}
.plot-head {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 6px 2px 8px;
  min-width: 0;
}
.pop-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
  border: 1px solid transparent;
  background: transparent;
  border-radius: 6px;
  padding: 3px 6px;
  font-weight: 600;
  font-size: 13px;
}
.pop-btn:hover {
  border-color: var(--line);
  background: var(--panel-2);
}
.pop-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.plot-head-tools {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 2px;
  flex: none;
}
.mini-seg {
  display: inline-flex;
  background: var(--sunken);
  border-radius: 6px;
  padding: 2px;
  gap: 1px;
}
.mini-seg button {
  width: 24px;
  height: 22px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--fg-3);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.mini-seg button:hover {
  color: var(--fg);
}
.mini-seg button.is-on {
  background: var(--panel);
  color: var(--accent);
  box-shadow: 0 0 0 1px var(--line);
}
.plot-body {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr);
  grid-template-rows: auto auto;
  padding: 2px 8px 0 4px;
}
.plot-canvas-wrap {
  position: relative;
  aspect-ratio: 1 / 1;
  max-width: 100%;
  min-width: 0;
}
.plot-canvas {
  display: block;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.plot-canvas-wrap.tool-select .plot-canvas {
  cursor: default;
}
.plot-canvas-wrap:not(.tool-select) .plot-canvas {
  cursor: crosshair;
}
.axis-x, .axis-y {
  border: 1px solid transparent;
  background: transparent;
  border-radius: 6px;
  color: var(--fg-2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font-size: 12px;
  min-width: 0;
}
.axis-x b, .axis-y b {
  color: var(--fg);
  font-weight: 600;
}
.axis-x span, .axis-y span {
  color: var(--fg-3);
}
.axis-x {
  justify-self: center;
  margin: 0 0 0 40px;
  padding: 2px 8px;
  max-width: calc(100% - 40px);
  white-space: nowrap;
  overflow: hidden;
}
.axis-y {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  padding: 8px 2px;
  align-self: center;
  margin-bottom: 26px;
  white-space: nowrap;
  max-height: 100%;
  overflow: hidden;
}
.axis-y .axis-text {
  display: inline-flex;
  gap: 5px;
}
.axis-x:hover, .axis-y:hover {
  border-color: var(--line);
  background: var(--panel-2);
  color: var(--fg);
}
.axis-x .icon, .axis-y .icon {
  color: var(--accent);
}
.plot-foot {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 2px 10px 8px 34px;
  color: var(--fg-3);
  font-size: 11.5px;
  min-height: 24px;
}
.plot-foot .link-btn {
  font-size: 11.5px;
  margin-left: auto;
}
.plot-foot .readout {
  color: var(--accent);
  white-space: pre;
}
.plot-foot .readout:empty {
  display: none;
}
.gate-name-edit {
  position: absolute;
  z-index: 3;
  width: 180px;
}
.gate-name-edit .field {
  padding: 3px 7px;
  font-weight: 600;
  box-shadow: var(--shadow-pop);
}

/* axis menu */
.axis-menu {
  padding: 0;
}
.axis-search {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px;
  border-bottom: 1px solid var(--line);
  color: var(--fg-3);
}
.axis-search .field {
  border-color: transparent;
  box-shadow: none;
  padding: 3px 4px;
}
.axis-list {
  max-height: 260px;
  overflow: auto;
  padding: 4px;
}
.axis-group-title {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--fg-3);
  padding: 6px 8px 2px;
}
.axis-opt {
  display: grid;
  grid-template-columns: 16px auto minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 6px;
  width: 100%;
  border: 0;
  background: transparent;
  text-align: left;
  border-radius: 6px;
  padding: 5px 8px;
}
.axis-opt:hover, .axis-opt:focus-visible {
  background: var(--panel-2);
  outline: none;
}
.axis-opt.is-on {
  background: var(--accent-soft);
}
.axis-opt b {
  font-weight: 600;
}
.axis-opt span {
  color: var(--fg-3);
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.axis-check {
  color: var(--accent);
}
.comp-badge {
  font-style: normal;
  font-size: 9.5px;
  color: var(--fg-3);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 0 3px;
}
.axis-none {
  padding: 12px;
  color: var(--fg-3);
}
.axis-opt .axis-del {
  font-style: normal;
  display: inline-flex;
  padding: 2px;
  border-radius: 4px;
  color: var(--fg-3);
}
.axis-opt .axis-del:hover {
  color: var(--bad);
  background: var(--sunken);
}
.axis-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
}
.axis-row .axis-opt {
  min-width: 0;
}
.axis-relabel {
  font-style: normal;
  display: inline-flex;
  padding: 5px;
  margin-right: 4px;
  border-radius: 4px;
  color: var(--fg-3);
  opacity: 0;
}
.axis-row:hover .axis-relabel, .axis-relabel:focus-visible {
  opacity: 1;
}
.axis-relabel:hover {
  color: var(--accent);
  background: var(--sunken);
}
.axis-relabel-form {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;
}
.axis-relabel-form .field {
  flex: 1;
  min-width: 0;
}
.axis-relabel-form .icon-btn {
  display: inline-flex;
  padding: 5px;
  border: 0;
  background: transparent;
  border-radius: 4px;
  color: var(--fg-3);
}
.axis-relabel-form .icon-btn:hover {
  color: var(--accent);
  background: var(--sunken);
}
.ratio-row {
  border-top: 1px solid var(--line);
  padding: 7px 10px;
  font-size: 12px;
}
.ratio-form {
  border-top: 1px solid var(--line);
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.ratio-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  gap: 6px;
}
.ratio-grid.two {
  grid-template-columns: minmax(0, 1fr) auto;
}
.ratio-op {
  color: var(--fg-3);
  font-weight: 600;
}
.scale-editor {
  border-top: 1px solid var(--line);
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: var(--panel-2);
  border-radius: 0 0 var(--radius) var(--radius);
}
.scale-editor .seg {
  align-self: flex-start;
}
.scale-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}
.scale-head .link-btn {
  font-size: 11.5px;
}
.scale-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.scale-grid.three {
  grid-template-columns: 1fr 1fr 1fr;
}
.scale-grid label, .bound {
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: 11px;
  color: var(--fg-3);
  min-width: 0;
}
.scale-slider {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 8px;
}
.scale-slider label {
  display: flex;
  gap: 6px;
  align-items: baseline;
  font-size: 11.5px;
  color: var(--fg-2);
}
.scale-slider input {
  accent-color: var(--accent);
  width: 100%;
}
.scale-note {
  margin: 0;
  font-size: 11.5px;
  color: var(--fg-3);
}

/* ------------------------------------------------------------------ inspector */
.inspector {
  width: 300px;
  flex: none;
  overflow: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.insp {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 12px;
}
.insp-head {
  display: flex;
  align-items: center;
  gap: 10px;
}
.insp-title {
  min-width: 0;
  flex: 1;
}
.insp-name {
  font-size: 15px;
  font-weight: 600;
}
.insp-kind {
  color: var(--fg-3);
  font-size: 12px;
}
.insp-path {
  font-size: 12px;
  color: var(--fg-2);
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 5px 8px;
}
.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.stat-grid > div {
  background: var(--panel);
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.stat-grid b {
  font-size: 15px;
  font-weight: 500;
}
.stat-grid .eyebrow {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.scope-card {
  display: flex;
  gap: 10px;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--panel-2);
}
.scope-card .icon {
  color: var(--accent);
  margin-top: 2px;
}
.scope-card.is-own {
  border-color: color-mix(in oklab, var(--warn) 40%, var(--line));
  background: color-mix(in oklab, var(--warn) 7%, var(--panel));
}
.scope-card.is-own .icon {
  color: var(--warn);
}
.scope-card p {
  margin: 2px 0 8px;
  color: var(--fg-2);
  font-size: 12px;
}
.scope-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.geom {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.geom-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.geom-read {
  margin: 0;
  color: var(--fg-2);
}
.insp-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  border-top: 1px solid var(--line);
  padding-top: 12px;
}
.insp-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
}
.insp-section:last-child {
  border-bottom: 0;
}
.insp-section.tip {
  flex-direction: row;
  color: var(--fg-3);
  font-size: 12px;
}
.insp-section.tip p {
  margin: 0;
}
.insp-sample {
  font-size: 15px;
  font-weight: 600;
  overflow-wrap: anywhere;
}
.kv {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 4px 12px;
  margin: 0;
  font-size: 12.5px;
}
.kv dt {
  color: var(--fg-3);
}
.kv dd {
  margin: 0;
  min-width: 0;
  overflow-wrap: anywhere;
}
.note-warn {
  display: flex;
  gap: 6px;
  align-items: flex-start;
  color: var(--warn);
  font-size: 12px;
  margin: 0;
}
.note-list {
  margin: 0;
  padding-left: 18px;
  color: var(--fg-2);
  font-size: 12px;
}
.setting {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 12.5px;
  color: var(--fg-2);
}
.setting.row {
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.setting.check {
  justify-content: flex-start;
}
.setting input[type="range"] {
  accent-color: var(--accent);
  width: 120px;
}
.setting input[type="checkbox"], .check-row input, .pop-check input {
  accent-color: var(--accent);
}
.cmap-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.cmap {
  display: flex;
  flex-direction: column;
  gap: 4px;
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 7px;
  padding: 6px;
  font-size: 11.5px;
  text-align: left;
  color: var(--fg-2);
}
.cmap i {
  display: block;
  height: 8px;
  border-radius: 3px;
}
.cmap.is-on {
  border-color: var(--accent);
  color: var(--fg);
  box-shadow: 0 0 0 2px var(--accent-soft);
}

/* ------------------------------------------------------------------ menus & popovers */
.popover {
  position: fixed;
  z-index: 50;
  background: var(--panel);
  border: 1px solid var(--line-2);
  border-radius: var(--radius);
  box-shadow: var(--shadow-pop);
  max-height: calc(100vh - 16px);
  overflow: auto;
}
.menu {
  min-width: 220px;
  max-width: 340px;
  padding: 4px;
}
.menu-title {
  padding: 6px 10px 4px;
  font-size: 11px;
  font-weight: 600;
  color: var(--fg-3);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.menu-heading {
  padding: 8px 10px 3px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--fg-3);
}
.menu-item {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  border: 0;
  background: transparent;
  text-align: left;
  padding: 6px 10px 6px 8px;
  border-radius: 6px;
  color: var(--fg);
  white-space: pre;
}
.menu-item:hover:not(:disabled), .menu-item:focus-visible {
  background: var(--panel-2);
  outline: none;
}
.menu-item:disabled {
  color: var(--fg-3);
  cursor: default;
}
.menu-item.is-danger {
  color: var(--bad);
}
.menu-icon {
  width: 16px;
  display: inline-flex;
  color: var(--fg-3);
}
.menu-label {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
}
.menu-hint {
  color: var(--fg-3);
  font-size: 11px;
}
.menu-sep {
  height: 1px;
  background: var(--line);
  margin: 4px 6px;
}
.menu-swatches {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  padding: 6px 10px;
}
.menu-sub {
  margin: 0 0 4px 22px;
  padding-left: 6px;
  border-left: 1px solid var(--line);
  max-height: 260px;
  overflow: auto;
}
.menu-item.is-open {
  background: var(--panel-2);
}
.stat-grid > div:last-child:nth-child(odd) {
  grid-column: span 2;
}

/* dialogs */
.dialog-backdrop {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: rgba(10, 14, 20, 0.42);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: max(40px, env(safe-area-inset-top, 0px)) 16px 16px;
  overflow: auto;
}
.dialog {
  background: var(--panel);
  border: 1px solid var(--line-2);
  border-radius: 12px;
  box-shadow: var(--shadow-pop);
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 80px);
}
.dialog-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 14px 8px 18px;
}
.dialog-head h2 {
  font-size: 16px;
  font-weight: 600;
}
.dialog-body {
  padding: 4px 18px 14px;
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.dialog-foot {
  display: flex;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px 18px;
  border-top: 1px solid var(--line);
}
.field-row {
  display: grid;
  grid-template-columns: 130px minmax(0, 1fr);
  align-items: center;
  gap: 10px;
  font-size: 12.5px;
  color: var(--fg-2);
}
.check-list {
  display: flex;
  flex-direction: column;
  gap: 1px;
  max-height: 260px;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 4px;
}
.check-list.short {
  max-height: 160px;
}
.check-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 6px;
  border-radius: 5px;
  cursor: pointer;
  min-width: 0;
}
.check-row:hover {
  background: var(--panel-2);
}
.check-row span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.check-row .grow {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 0;
}
.concat-menu {
  padding: 10px;
}
.concat-head p {
  margin: 4px 0 8px;
}
.concat-actions {
  display: flex;
  gap: 12px;
  margin-bottom: 8px;
}
.dotsize-pop {
  padding: 9px 10px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
  width: max-content;
}
.dotsize-row {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12.5px;
  color: var(--fg-2);
  white-space: nowrap;
}
.dotsize-field {
  width: 46px;
  padding: 3px 4px;
}
.dotsize-reset {
  font-size: 11.5px;
  white-space: nowrap;
}
.ws-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.ws-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
}
.ws-row.is-current {
  border-color: color-mix(in oklab, var(--accent) 50%, var(--line));
  background: var(--accent-soft);
}
.ws-row-main {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
  min-width: 0;
}
.ws-row-main b {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ws-row-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: none;
}
.ctl-table {
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-height: 330px;
  overflow: auto;
}
.ctl-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 260px;
  align-items: center;
  gap: 10px;
  padding: 3px 0;
}
.ctl-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.help h3 {
  font-size: 13px;
  margin: 4px 0 6px;
}
.help ol {
  margin: 0;
  padding-left: 20px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-width: 65ch;
}
.help p {
  max-width: 65ch;
}
.keys {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 4px 14px;
  margin: 0;
}
.keys dd {
  margin: 0;
  color: var(--fg-2);
}
kbd {
  font-family: var(--font-mono);
  font-size: 11px;
  border: 1px solid var(--line-2);
  border-bottom-width: 2px;
  border-radius: 4px;
  padding: 0 5px;
  background: var(--panel-2);
}

/* toasts */
.toasts {
  position: fixed;
  z-index: 60;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: max(16px, env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: flex-end;
  pointer-events: none;
  max-width: calc(100vw - 32px);
}
.toast {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--fg);
  color: var(--panel);
  border-radius: 9px;
  padding: 9px 10px 9px 14px;
  box-shadow: var(--shadow-pop);
  max-width: 460px;
  font-size: 12.5px;
  animation: rise 0.18s ease-out;
}
.toast-warn {
  border-left: 3px solid var(--warn);
}
.toast-error {
  border-left: 3px solid var(--bad);
}
.toast-action {
  border: 0;
  background: none;
  color: var(--accent-2);
  font-weight: 600;
  padding: 0 4px;
}
.toast-x {
  border: 0;
  background: none;
  color: inherit;
  opacity: 0.6;
  display: inline-flex;
  padding: 2px;
}
@keyframes rise {
  from {
    transform: translateY(6px);
    opacity: 0;
  }
}
.drop-overlay {
  position: fixed;
  inset: 0;
  z-index: 70;
  background: color-mix(in oklab, var(--accent) 14%, transparent);
  border: 3px dashed var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.drop-card {
  background: var(--panel);
  border-radius: 12px;
  padding: 22px 28px;
  box-shadow: var(--shadow-pop);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  text-align: center;
  color: var(--fg-2);
}
.drop-card .icon {
  color: var(--accent);
}
.drop-card b {
  color: var(--fg);
  font-size: 15px;
}
.empty {
  margin: 40px auto;
  max-width: 460px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 8px;
  color: var(--fg-2);
  padding: 0 16px;
}
.empty-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: var(--accent-soft);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
}
.empty-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--fg);
}
.empty-text {
  max-width: 52ch;
}
.empty-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-top: 6px;
}

/* ------------------------------------------------------------------ cards & views */
.card {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}
.card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.card-head h2, .h2-edit {
  font-size: 14px;
  font-weight: 600;
}
.card-head-tools {
  margin-left: auto;
  display: flex;
  gap: 2px;
}
.card-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.view-pad {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.view-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.vt-left, .vt-right {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.vt-left select {
  width: auto;
}
.view-title {
  font-size: 18px;
  font-weight: 600;
  margin-right: 6px;
}
.table-scroll {
  flex: 1;
  min-height: 0;
  overflow: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.stats-table, .kw-table {
  border-collapse: separate;
  border-spacing: 0;
  width: max-content;
  min-width: 100%;
}
.stats-table th, .stats-table td, .kw-table th, .kw-table td {
  border-bottom: 1px solid var(--line);
  padding: 6px 12px;
  text-align: left;
  vertical-align: middle;
}
.stats-table thead th, .kw-table thead th {
  position: sticky;
  top: 0;
  background: var(--panel-2);
  z-index: 2;
  font-weight: 500;
}
.stats-table thead th {
  padding-right: 28px;
  position: sticky;
}
.stats-table td.num {
  text-align: right;
  background: color-mix(in oklab, var(--accent) var(--heat, 0%), var(--panel));
}
.sticky-col {
  position: sticky;
  left: 0;
  background: var(--panel);
  z-index: 1;
  border-right: 1px solid var(--line);
  max-width: 260px;
}
thead .sticky-col {
  z-index: 3;
  background: var(--panel-2);
}
.th-wrap {
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.th-top {
  font-size: 11px;
  color: var(--fg-3);
}
.th-main {
  font-weight: 600;
}
.th-main em {
  font-style: normal;
  color: var(--fg-2);
  font-weight: 500;
}
.th-more {
  position: absolute;
  right: 4px;
  top: 50%;
  transform: translateY(-50%);
  border: 0;
  background: none;
  color: var(--fg-3);
  border-radius: 4px;
  padding: 2px;
  display: inline-flex;
}
.th-more:hover {
  color: var(--fg);
  background: var(--sunken);
}
.kw-cell {
  color: var(--fg-2);
  max-width: 260px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pad {
  padding: 12px;
}
.pad-b {
  padding: 10px 12px 0;
  margin: 0;
}
.adder {
  padding: 0;
}
.adder-body {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.adder-body .field-row {
  grid-template-columns: 90px minmax(0, 1fr);
}
.adder-foot {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}
.pop-checks {
  max-height: 210px;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 4px 0;
}
.pop-check {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 3px 8px;
  cursor: pointer;
}
.pop-check:hover {
  background: var(--panel-2);
}
.search {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--fg-3);
}
.search .field {
  width: 200px;
}
.keywords-view .kw-table th.mono {
  color: var(--fg-2);
  font-weight: 500;
  white-space: nowrap;
}
.keywords-view .kw-table td.mono {
  overflow-wrap: anywhere;
  max-width: 70ch;
}
.kw-compare {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr);
  gap: 12px;
}
.kw-pick {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 0;
}
.kw-pick .check-list {
  max-height: none;
  flex: 1;
  background: var(--panel);
}

/* compensation */
.comp {
  flex: 1;
  min-height: 0;
  display: flex;
  gap: 12px;
}
.comp-side {
  width: 300px;
  flex: none;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow: auto;
}
.comp-main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow: auto;
  padding-bottom: 16px;
}
.mat-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.mat-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 6px 6px 8px;
  border-radius: 6px;
  cursor: pointer;
}
.mat-row:hover {
  background: var(--panel-2);
}
.mat-row.is-on {
  background: var(--accent-soft);
}
.mat-row.is-on .mat-name {
  font-weight: 600;
  color: var(--accent);
}
.mat-row .icon {
  color: var(--fg-3);
}
.mat-name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.comp-side .card-actions .btn {
  width: 100%;
  justify-content: flex-start;
}
.comp-side .field-row {
  grid-template-columns: 1fr;
  gap: 4px;
}
.assign-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  max-height: 320px;
  overflow: auto;
}
.assign-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 128px;
  gap: 8px;
  align-items: center;
  padding: 3px 4px;
  border-radius: 5px;
  font-size: 12.5px;
}
.assign-row.is-current {
  background: var(--panel-2);
  font-weight: 600;
}
.assign-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.mat-scroll {
  overflow: auto;
  max-width: 100%;
}
.mat-table {
  border-collapse: separate;
  border-spacing: 2px;
  font-size: 12px;
}
.mat-table th {
  font-weight: 500;
  color: var(--fg-2);
  text-align: center;
  padding: 2px 4px;
  border-radius: 4px;
  white-space: nowrap;
}
.mat-table th[scope="row"] {
  text-align: right;
}
.mat-table th.is-hl {
  color: var(--accent);
  background: var(--accent-soft);
}
.mat-det {
  display: block;
  font-family: var(--font-mono);
  font-size: 11px;
}
.mat-mk {
  display: block;
  font-size: 10.5px;
  color: var(--fg-3);
  font-weight: 600;
}
.mat-table td {
  min-width: 62px;
  text-align: right;
  padding: 5px 8px;
  border-radius: 4px;
  border: 1px solid var(--line);
  cursor: default;
}
.mat-table td.is-diag {
  color: var(--fg-3);
  background: var(--sunken);
}
.mat-table td.is-sel {
  outline: 2px solid var(--accent);
  outline-offset: -1px;
}
.mat-table.compact td {
  min-width: 54px;
  padding: 3px 6px;
}
.cell-input {
  width: 64px;
  border: 0;
  background: transparent;
  text-align: right;
  font-family: var(--font-mono);
  font-size: 12px;
  outline: none;
}
.preview-ctl {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}
.preview-ctl select {
  width: auto;
  max-width: 220px;
}
.preview-card .notice {
  margin: 0;
}
.preview-body {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  align-items: flex-start;
}
.nxn {
  display: grid;
  gap: 3px;
  overflow: auto;
  max-width: 100%;
}
.nxn-col {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--fg-2);
  text-align: center;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  align-self: end;
}
.nxn-row {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--fg-2);
  align-self: center;
  justify-self: end;
  padding-right: 4px;
  white-space: nowrap;
}
.nxn-diag {
  background: var(--sunken);
  border-radius: 3px;
}
canvas.mini {
  border-radius: 3px;
  cursor: pointer;
}
canvas.mini.is-hl {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
.big-check {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-width: 300px;
}
.big-check p, .big-hint {
  margin: 0;
}

/* layout */
.layout-view {
  flex: 1;
  min-height: 0;
  display: flex;
  gap: 12px;
}
.layout-side {
  width: 300px;
  flex: none;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow: auto;
}
.layout-side .field-row {
  grid-template-columns: 80px minmax(0, 1fr);
}
.layout-main {
  flex: 1;
  min-width: 0;
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding-bottom: 24px;
}
.batch {
  display: grid;
  gap: 10px;
  align-items: start;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
  width: max-content;
  max-width: none;
}
.batch-col {
  font-size: 12px;
  font-weight: 600;
  color: var(--fg-2);
  padding: 0 4px;
}
.batch-row {
  font-size: 12px;
  font-weight: 600;
  color: var(--fg);
  align-self: center;
  overflow-wrap: anywhere;
}
.static-panel {
  display: block;
}
.overlays {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}
.overlay-card {
  flex: 1 1 520px;
  max-width: 900px;
}
.overlay-body {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
}
.overlay-ctl {
  flex: 1 1 220px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}
.overlay-ctl .field-row {
  grid-template-columns: 80px minmax(0, 1fr);
}
.title-input {
  border: 1px solid transparent;
  background: transparent;
  font-weight: 600;
  font-size: 14px;
  border-radius: 6px;
  padding: 2px 6px;
  margin-left: -6px;
  min-width: 0;
  flex: 1;
}
.title-input:hover {
  border-color: var(--line);
}
.title-input:focus {
  outline: none;
  border-color: var(--accent);
}

/* ------------------------------------------------------------------ responsive */
@media (max-width: 1240px) {
  .gating.with-inspector {
    flex-direction: column;
  }
  .gating.with-inspector .inspector {
    width: auto;
    max-height: 300px;
  }
  .gating.with-inspector .insp {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    align-items: start;
  }
}
@media (max-width: 980px) {
  .ws-label {
    display: none;
  }
  .sidebar {
    width: 240px;
  }
  .sidebar-resizer {
    display: none;
  }
  .scope-label {
    display: none;
  }
}
@media (max-width: 820px) {
  html, body, #app, .app {
    height: auto;
    min-height: 100%;
  }
  .topbar-inner {
    flex-wrap: wrap;
    gap: 8px 10px;
  }
  .ws {
    border-left: 0;
    padding-left: 0;
    flex: 1 1 auto;
  }
  .views {
    order: 5;
    width: 100%;
    margin-left: 0;
  }
  .view-tab span {
    display: inline;
  }
  .app-body, .gating, .comp, .layout-view {
    flex-direction: column;
  }
  .sidebar, .inspector, .comp-side, .layout-side {
    width: auto;
  }
  .panel.samples {
    max-height: none;
  }
  .sample-list {
    max-height: 240px;
  }
  .tree-list {
    max-height: 320px;
  }
  .plot-grid, .table-scroll, .layout-main, .comp-main {
    overflow: visible;
  }
  .table-scroll {
    overflow-x: auto;
  }
  .gating.with-inspector .inspector {
    max-height: none;
  }
  .kw-compare {
    grid-template-columns: 1fr;
  }
  .ctl-row {
    grid-template-columns: 1fr;
  }
  .field-row {
    grid-template-columns: 1fr;
    gap: 4px;
  }
  .batch {
    max-width: 100%;
    overflow-x: auto;
  }
  .layout-main {
    overflow-x: hidden;
  }
}
@media (max-width: 520px) {
  .brand-word {
    display: none;
  }
  .toolbar-end .size-ctl {
    display: none;
  }
  .ws-name {
    max-width: 180px;
  }
  .view-tab {
    padding: 5px 8px;
  }
  .search .field {
    width: 140px;
  }
}

/* ------------------------------------------------------------------ backgating strip */
.backgate {
  flex: none;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 6px 10px 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}
.backgate.is-closed {
  padding-bottom: 6px;
}
.bg-head {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  font-size: 12px;
}
.bg-toggle {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: none;
  border: 0;
  padding: 2px 4px 2px 0;
  color: var(--fg-2);
  cursor: pointer;
}
.bg-sel {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.bg-sel .muted {
  font-weight: 400;
}
.bg-sel i {
  width: 9px;
  height: 9px;
  border-radius: 2px;
  flex: none;
}
.bg-row {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 2px;
}
.bg-item {
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 2px;
  padding: 4px 4px 6px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  cursor: pointer;
  text-align: left;
  color: var(--fg);
}
.bg-item canvas {
  display: block;
}
.bg-item:hover,
.bg-item:focus-visible {
  border-color: var(--accent);
}
.bg-item.is-current {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}
.bg-cap {
  display: flex;
  align-items: baseline;
  gap: 5px;
  padding: 0 6px;
  font-size: 12px;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
}
.bg-from {
  color: var(--fg-2);
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.bg-arrow {
  color: var(--fg-3);
}
.bg-to {
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.bg-item.is-current .bg-to {
  color: var(--accent);
}
@media (max-height: 760px) {
  .bg-row { gap: 8px; }
}

/* ------------------------------------------------------------------ batch view */
.batch-view {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.batch-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 14px;
}
.batch-bar h2 {
  margin: 0;
  font-size: 18px;
}
.batch-ctl {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 14px;
}
.field-inline {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--fg-2);
}
.batch-scroll {
  flex: 1;
  min-height: 0;
  overflow: auto;
}
.batch-all .batch-col {
  display: flex;
  flex-direction: column;
  gap: 1px;
  position: sticky;
  top: 0;
  background: var(--panel);
  z-index: 1;
  padding-bottom: 4px;
}
.batch-all .batch-col span {
  font-weight: 400;
  color: var(--fg-3);
  font-size: 11px;
}
.batch-all .batch-row {
  position: sticky;
  left: 0;
  background: var(--panel);
  z-index: 1;
  align-self: stretch;
  display: flex;
  align-items: center;
}
.batch-corner {
  position: sticky;
  top: 0;
  left: 0;
  background: var(--panel);
  z-index: 2;
}
.batch-cell {
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
  border-radius: 6px;
}
.batch-cell:hover,
.batch-cell:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
.batch-cell-static {
  cursor: default;
}
.mat-hidden {
  margin: 0 0 8px;
}

</style>
