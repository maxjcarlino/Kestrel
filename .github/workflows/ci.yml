name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Committed dist/kestrel.html matches the source
        run: git diff --exit-code dist/kestrel.html || (echo "Run npm run build and commit dist/kestrel.html" && exit 1)
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run compliance
